{% extends 'donor_app/base.html' %}
{% load static %}

{% block title %}Signup — Bhumi{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 450px; margin: 3rem auto;">
    <div class="form-header">
        <img src="{% static 'images/logo.jpeg' %}" alt="Logo" class="form-header-logo">
        <h2>Create Account</h2>
    </div>
    <form method="POST" action="{% url 'account_signup' %}">
        {% csrf_token %}
        {% if form.errors %}
            <div class="alert alert-error" style="position: static; margin-bottom: 1rem;">Please fix the errors below.</div>
        {% endif %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="username" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password1" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="password2" placeholder="••••••••" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Sign Up</button>
            <a href="{% url 'account_login' %}" class="btn btn-outline">Already have account?</a>
        </div>
    </form>
</div>
{% endblock %}
