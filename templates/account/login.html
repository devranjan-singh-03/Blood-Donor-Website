{% extends 'donor_app/base.html' %}
{% load static %}

{% block title %}Login — Bhumi{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 450px; margin: 3rem auto;">
    <div class="form-header">
        <img src="{% static 'images/logo.jpeg' %}" alt="Logo" class="form-header-logo">
        <h2>Login</h2>
    </div>
    <form method="POST" action="{% url 'account_login' %}">
        {% csrf_token %}
        {% if form.errors %}
            <div class="alert alert-error" style="position: static; margin-bottom: 1rem;">Invalid email or password.</div>
        {% endif %}
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="login" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Login</button>
            <a href="{% url 'account_signup' %}" class="btn btn-outline">Create Account</a>
        </div>
    </form>
</div>
{% endblock %}
