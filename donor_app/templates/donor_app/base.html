<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blood Donor Management{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="{% url 'home' %}">
                    <i class="fas fa-heartbeat"></i> Blood Donor
                </a>
            </div>
            <div class="nav-menu">
                <a href="{% url 'home' %}"><i class="fas fa-home"></i> Home</a>
                <a href="{% url 'add_donor' %}"><i class="fas fa-user-plus"></i> Add Donor</a>
                <a href="{% url 'donor_list' %}"><i class="fas fa-users"></i> Donors</a>
                <a href="{% url 'search_donor' %}"><i class="fas fa-search"></i> Search</a>
            </div>
            <div class="nav-search">
                <form action="{% url 'search_donor' %}" method="GET">
                    <input type="text" name="q" placeholder="Search donors...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
        </div>
    </nav>

    <main>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 Blood Donor Management System</p>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
